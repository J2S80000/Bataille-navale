name: bataille_navale
description: A Battleship game with Firebase backend, game history tracking, statistics, and genetic algorithm AI.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.8.0
  cloud_firestore: ^5.4.0
  firebase_auth: ^5.3.0
  
  # MongoDB for web
  mongo_dart: ^0.10.5
  http: ^1.1.0
  
  # State Management
  provider: ^6.1.5+1
  
  # UI Components
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  intl: ^0.20.1
  google_fonts: ^6.1.0
  
  # Utils
  uuid: ^4.0.0
  equatable: ^2.0.5

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSans
      fonts:
        - asset: fonts/NotoSans-Regular.ttf
        - asset: fonts/NotoSans-Bold.ttf
          weight: 700

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.25.6
